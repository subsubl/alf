name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pi_hub/requirements.txt
            server_agent/requirements.txt

      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pi_hub/requirements.txt -r server_agent/requirements.txt pytest

      - name: Spixi VoIP / AppDataMessage protocol tests
        run: python tools/test_ixian_voip.py -v

      - name: Unit, security and offline E2E suites
        run: python -m pytest tests tools/test_ixian_voip.py -v

  lint-shell:
    name: ShellCheck (deploy scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --severity=warning deploy/*.sh deploy/image/*.sh

  firmware:
    name: Firmware build (Zephyr 3.7 LTS, ESP32-S3)
    runs-on: ubuntu-22.04
    env:
      ZEPHYR_SDK_VERSION: "0.16.8"
    steps:
      - uses: actions/checkout@v4
        with:
          path: alf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget xz-utils file make libmagic1

      - name: Install west and Zephyr workspace
        run: |
          pip install "cmake<4" west pyelftools
          west init --mr v3.7.0 "$HOME/zephyrproject"
          cd "$HOME/zephyrproject"
          west update --narrow -o=--depth=1
          west config manifest.project-filter -- +hal_espressif,+hal_xtensa,+lvgl,+mbedtls,+picolibc,+tinycrypt,+cmsis
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt
          west blobs fetch hal_espressif

      - name: Cache Zephyr SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-xtensa-s3

      - name: Install Zephyr SDK (ESP32-S3 toolchain only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          cd "zephyr-sdk-${ZEPHYR_SDK_VERSION}"
          ./setup.sh -t xtensa-espressif_esp32s3_zephyr-elf -h -c

      - name: Register Zephyr SDK
        run: "$HOME/zephyr-sdk-${ZEPHYR_SDK_VERSION}/setup.sh -c"

      - name: Build esp32_face_os
        run: |
          cd "$HOME/zephyrproject"
          west build -b esp32s3_touch_lcd_1_28/esp32s3/procpu "$GITHUB_WORKSPACE/alf/esp32_face_os" -d build --pristine

      - name: Collect firmware artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$HOME/zephyrproject/build/zephyr/zephyr.bin" "$HOME/zephyrproject/build/zephyr/zephyr.elf" "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: esp32_face_os-firmware
          path: out/*
          if-no-files-found: error
