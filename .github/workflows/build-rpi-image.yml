name: Build Raspberry Pi image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      quixi_ref:
        description: "QuIXI git ref (tag/branch) to bundle"
        default: "v0.9.4a"
      ixian_core_ref:
        description: "Ixian-Core git ref to build QuIXI against"
        default: "master"

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  quixi-arm64:
    name: Build QuIXI (linux-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuIXI
        uses: actions/checkout@v4
        with:
          repository: ixian-platform/QuIXI
          ref: ${{ inputs.quixi_ref || 'v0.9.4a' }}
          path: QuIXI

      - name: Checkout Ixian-Core
        uses: actions/checkout@v4
        with:
          repository: ixian-platform/Ixian-Core
          ref: ${{ inputs.ixian_core_ref || 'master' }}
          path: Ixian-Core

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained linux-arm64
        working-directory: QuIXI/QuIXI
        run: |
          dotnet publish QuIXI.csproj -c Release -r linux-arm64 --self-contained true -o "$GITHUB_WORKSPACE/quixi-linux-arm64"
          test -f "$GITHUB_WORKSPACE/quixi-linux-arm64/QuIXI"

      - uses: actions/upload-artifact@v4
        with:
          name: quixi-linux-arm64
          path: quixi-linux-arm64
          if-no-files-found: error

  image:
    name: Build Pi Zero 2 W image
    needs: [tests, quixi-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quixi-linux-arm64
          path: quixi-linux-arm64

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support parted e2fsprogs xz-utils

      - name: Download Raspberry Pi OS Lite (arm64)
        run: |
          curl -fL --retry 3 -o base.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64_latest
          xz -d base.img.xz
          ls -lh base.img

      - name: Build image
        run: sudo bash deploy/image/build_image.sh "$PWD/base.img" "$PWD/quixi-linux-arm64"

      - name: Name and compress
        id: pack
        run: |
          NAME="tamagci-pi-zero2w-${GITHUB_REF_NAME//\//-}-$(date -u +%Y%m%d)"
          mv base.img "${NAME}.img"
          xz -T0 -6 "${NAME}.img"
          sha256sum "${NAME}.img.xz" > "${NAME}.img.xz.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}".*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.img.xz
            ${{ steps.pack.outputs.name }}.img.xz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.name }}.img.xz
            ${{ steps.pack.outputs.name }}.img.xz.sha256
          generate_release_notes: true
